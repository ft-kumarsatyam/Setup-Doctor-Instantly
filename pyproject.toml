[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "setup-doctor"
version = "0.2.0"
description = "DNS diagnosis for cold-email setup (SPF/DKIM/DMARC/MX) with API, MCP, and agent skills."
requires-python = ">=3.10"
dependencies = ["langgraph", "dnspython"]

[project.optional-dependencies]
llm = ["anthropic"]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
mcp = ["mcp>=1.0,<2"]
dev = ["pytest", "fastapi>=0.110", "httpx>=0.27", "ruff>=0.6", "mcp>=1.0,<2"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests", "evals"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]


[project.scripts]
setup-doctor = "setup_doctor.surfaces.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
