# Setup Doctor on Fly — Instantly dual-MCP demo host
# App: https://setup-doctor-instantly.fly.dev
#
# Required before a public Instantly share:
#   fly secrets set SETUP_DOCTOR_API_KEYS='demo-key:instantly-demo'
# Optional:
#   fly secrets set INSTANTLY_API_KEY=… SETUP_DOCTOR_VAULT_KEY=…
#
# Deploy: fly deploy
# MCP URL for Cursor/Claude: https://setup-doctor-instantly.fly.dev/mcp

app = "setup-doctor-instantly"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  SETUP_DOCTOR_MOUNT_MCP = "1"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/healthz"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
